name: Auto Sign

on:
  schedule:
    # ========== 改动1：北京时间 00:05（UTC+8）→ UTC 16:05 ==========
    - cron: "5 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN: ${{ secrets.NTE_TOKEN }}
      # ========== 改动2：注入方糖 SendKey（GitHub Secrets 里配 SCKEY） ==========
      SCKEY: ${{ secrets.SCKEY }}
      EXIT_WHEN_FAIL: on
      NO_PAUSE: "1"
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check token secret
        shell: bash
        run: |
          if [ -z "$TOKEN" ]; then
            echo "NTE_TOKEN secret is not configured."
            echo "Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # ========== 改动3：入口换成带方糖推送的包装脚本 ==========
      - name: Run auto sign (with notify)
        run: python run_and_notify.py
