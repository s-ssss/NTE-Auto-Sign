name: Keep Alive

on:
  schedule:
    # 每 7 天一次（GitHub 休眠阈值约 60 天，7 天绰绰有余；UTC 时间）
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Keep alive ping
        run: |
          echo "Keep alive at $(date -u)"
          # 访问一个稳定公网服务，产生网络活动（可选，仅防 runner 空闲）
          curl -sS https://api.github.com/zen || true

      - name: Bump timestamp
        run: |
          # 修改时间戳文件，制造一次 commit，真正触发仓库 activity
          mkdir -p .github/keep-alive
          date -u > .github/keep-alive/last-run.txt

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: keep alive [skip ci]"
          file_pattern: ".github/keep-alive/last-run.txt"
